# Publishes the generated Obsidian vault to the repository wiki (LBA-REQ-103, ADR-0090).
#
# docs/ is the single source of truth: the shared repo-standards-review generator
# (.repo-standards-review/wiki_generate.py, configured by .wiki-generator.json) regenerates the whole wiki from it,
# this workflow commits the result to <repo>.wiki.git, then re-clones the published wiki and compares it with the
# generator (--check), so the wiki cannot drift from develop. Pull requests validate the wiki through the wiki-vault
# gate in the local gate suite; only develop publishes.
#
# The published wiki has canonical test pages (VITechnologies/projectbuddy#318 M3, issue #104): the job first runs the
# evidence adapter (scripts/wikiEvidence.mjs: the gate suite and the npm test steps at this commit), converts its report
# to rsr/test-evidence@1 and runs scripts/check_wiki_canonical.py (two byte-identical builds, no placeholder,
# observations.py check). Any failure stops the job before the wiki is checked out, so nothing is published. The drift
# check compares a fresh clone of the published wiki with the canonical build from the same evidence; the plain
# generator's --check would report every canonical test page as drift. The evidence is execution evidence at the commit.
name: wiki-publish

on:
  push:
    branches:
      - develop
    paths:
      - 'docs/**'
      - '.wiki-generator.json'
      - '.wiki-canonical.json'
      - 'scripts/wikiEvidence.mjs'
      - 'scripts/wikiEvidenceTrace.mjs'
      - 'scripts/check_wiki_canonical.py'
      - 'scripts/wiki_lineage.py'
      - 'wiki-evidence/**'
      - '.repo-standards-review/wiki_generate.py'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Wiki / generate, publish, verify
    # Fail closed: the upstream always publishes its own wiki; a fork publishes its own wiki only when its owner sets the
    # repository variable WIKI_PUBLISH_ENABLED to 'true'. The push goes to ${{ github.repository }}.wiki with GITHUB_TOKEN.
    if: (github.repository == 'svelderrainruiz/labview-benchmark-actor' || vars.WIKI_PUBLISH_ENABLED == 'true') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the generated pages to the wiki repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run the gates and tests, write the report
        run: node scripts/wikiEvidence.mjs --report wiki-jest-report.json

      - name: Write the execution evidence
        run: python3 .repo-standards-review/observations.py evidence --format jest-json --report wiki-jest-report.json --platform linux-x64 --root . --output wiki-evidence.json

      - name: Validate the canonical wiki
        run: python3 scripts/check_wiki_canonical.py

      - name: Check out the wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Publish the wiki
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/check_wiki_canonical.py --out .wiki
          cd .wiki
          git add -A
          if git diff --cached --quiet; then
            echo "wiki is already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Generate from docs/ at ${SOURCE_SHA}"
          git push --quiet origin HEAD

      - name: Verify the published wiki (drift check)
        env:
          WIKI_URL: https://github.com/${{ github.repository }}.wiki.git
        run: |
          git clone --quiet "$WIKI_URL" "$RUNNER_TEMP/wiki-verify"
          python3 scripts/check_wiki_canonical.py --check-dir "$RUNNER_TEMP/wiki-verify"
